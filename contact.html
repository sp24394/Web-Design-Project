<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Westlake Community Garden</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body>
    <header>
        <div class="container"></div>
        <a href="/"><img class="logo" src="https://westlake.ibcdn.nz/img/wbhs-logo.png" alt="Westlake Boys High School Logo"></a>
        <div id="right-header"></div>
        <div id="left-header"></div>
        <a href="contact" style="position: absolute; top: calc(50% - 1.5rem); right: calc(50px + 1rem); padding: 0.5rem 1rem;">Contact</a>
    </header>
    <img id="bg" src="resources/contact-bg.png">
    <main id="contact-main">
        <h1>Contact Us</h1><br>
        <a href="https://goo.gl/maps/6HacMqGYef5rBSaGA" target="_blank">30 Forrest Hill Road, Takapuna, Auckland</a><br>
        <a href="mailto:dhu@westlake.school.nz">dhu@westlake.school.nz</a><br>
        <a href="tel:5735">Phone: +64 9 410 8667</a><br>
        <span>Fax: +64 9 410 7717</span><br><br><br>
        <h2 style="font-weight: 500;">Contact Form</h2><br>
        <form action="/" class="sort-vert">
            <div style="display: flex; flex-direction: row; gap: 30px; margin-bottom: 1rem;">
                <div style="flex: 1;">
                    <label for="fname">First Name <span style="color: #CB3444;">*</span></label>
                    <input required type="text" id="fname" name="fname" placeholder="John">
                </div>
                <div style="flex: 1;">
                    <label for="lname">Last Name <span style="color: #CB3444;">*</span></label>
                    <input required type="text" id="lname" name="lname" placeholder="Smith">
                </div>
            </div>

            <div style="flex: 1; margin-bottom: 1rem;">
                <label for="enquiry">Enquiry <span style="color: #CB3444;">*</span></label>
                <textarea required name="enquiry" id="enquiry" rows="8"></textarea>
            </div>
            <div style="flex: 1;">
                <label for="email">Email <span style="color: #CB3444;">*</span></label>
                <input type="email" id="email" name="email" required placeholder="johnsmith@example.com">
            </div>

            <input type="submit" value="Submit" id="submit" style="font-family: 'Inter';">
        </form>
        
    </main>
    
    <footer>
        <h1 style="font-size: 1.5rem; font-weight: 500;">Westlake Community Garden</h1><br>
        <a href="https://goo.gl/maps/6HacMqGYef5rBSaGA" target="_blank">30 Forrest Hill Road<br>Takapuna<br>Auckland</a><br><br>
        <a href="mailto:office@westlake.school.nz">office@westlake.school.nz</a><br><br>
        <span>Copyright &copy; 2024 Westlake Community Garden</span><br>
    </footer>
</body>
</html>
